<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seguiment en Directe — Cavalcada de Reis</title>
    <meta name="description"
        content="Segueix en directe la ubicació dels Reis Mags durant la Cavalcada. Mapa en temps real.">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4a017;
            --gold-light: #f5d060;
            --burgundy: #6b1d3a;
            --burgundy-dark: #4a0e25;
            --cream: #fdf6e3;
            --dark: #1a1a2e;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        html,
        body {
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background: var(--dark);
            color: var(--cream);
            overflow: hidden;
        }

        /* ===== Layout ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            z-index: 1000;
            flex-shrink: 0;
        }

        .header__title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header__icon {
            font-size: 1.6rem;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header__subtitle {
            font-size: 0.75rem;
            color: rgba(253, 246, 227, 0.6);
            font-weight: 400;
        }

        /* ===== Status Badge ===== */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .status-dot.searching {
            background: var(--gold);
            animation: pulse-dot 1s ease-in-out infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ===== Map ===== */
        #map {
            flex: 1;
            z-index: 1;
        }

        /* ===== Footer ===== */
        .footer {
            background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
            padding: 8px 20px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(253, 246, 227, 0.5);
            z-index: 1000;
            flex-shrink: 0;
        }

        .footer span {
            color: var(--gold);
        }

        /* ===== Leaflet marker customization ===== */
        .king-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .king-marker__inner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border: 3px solid var(--burgundy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 2px 12px rgba(212, 160, 23, 0.5);
            animation: marker-glow 3s ease-in-out infinite;
        }

        @keyframes marker-glow {

            0%,
            100% {
                box-shadow: 0 2px 12px rgba(212, 160, 23, 0.5);
            }

            50% {
                box-shadow: 0 2px 24px rgba(212, 160, 23, 0.8), 0 0 40px rgba(212, 160, 23, 0.3);
            }
        }

        .king-marker__pulse {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(212, 160, 23, 0.2);
            animation: pulse-ring 2s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.6);
                opacity: 1;
            }

            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        /* ===== Loading overlay ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-overlay__icon {
            font-size: 3rem;
            animation: float 2s ease-in-out infinite;
        }

        .loading-overlay__text {
            margin-top: 16px;
            font-size: 1rem;
            color: var(--gold);
            font-weight: 600;
        }

        .loading-overlay__spinner {
            margin-top: 20px;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(212, 160, 23, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Info popup on marker ===== */
        .leaflet-popup-content-wrapper {
            background: var(--burgundy) !important;
            color: var(--cream) !important;
            border-radius: 12px !important;
            box-shadow: var(--shadow) !important;
            font-family: 'Outfit', sans-serif !important;
        }

        .leaflet-popup-tip {
            background: var(--burgundy) !important;
        }

        .leaflet-popup-content {
            font-size: 0.85rem !important;
            line-height: 1.5 !important;
        }

        /* ===== Responsive ===== */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 0.95rem;
            }

            .header__subtitle {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Loading screen -->
    <div class="loading-overlay" id="loading">
        <div class="loading-overlay__icon">👑</div>
        <div class="loading-overlay__text">Connectant amb els Reis Mags…</div>
        <div class="loading-overlay__spinner"></div>
    </div>

    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header__title">
                <span class="header__icon">👑</span>
                <div>
                    <h1>Cavalcada de Reis — En Directe</h1>
                    <div class="header__subtitle">Seguiment en temps real</div>
                </div>
            </div>
            <div class="status-badge" id="statusBadge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connectant…</span>
            </div>
        </header>

        <!-- Map -->
        <div id="map"></div>

        <!-- Footer -->
        <footer class="footer">
            ⚠️ La ubicació pot tenir un retard d'<span>~30 segons</span> a causa de la cobertura mòbil.
        </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Firebase SDK eliminado (reemplazado por REST Polling) -->

    <script>
        // ============================================================
        // 🔧 CONFIGURACIÓN — EDITA ESTOS VALORES
        // ============================================================

        const CONFIG = {
            // 📍 Centro del mapa (coordenadas de la ruta oficial)
            mapCenter: [-34.9080, -56.1425],  // Aproximado al centro de la ruta proporcionada
            mapZoom: 15,

            // Campos en formato Traccar App
            latField: "latitude",
            lngField: "longitude",

            // 🛤️ Rastro / Trail
            trailMaxHours: 720,         // Mostrar los últimos 30 días temporalmente (para pruebas)
            trailColor: '#f5d060',      // Color dorado
            trailWeight: 4,             // Grosor de la línea
            trailOpacityMax: 0.9,       // Opacidad del tramo más reciente
            trailOpacityMin: 0.15,      // Opacidad del tramo más antiguo
            trailSegments: 8,           // Número de segmentos de degradado

            // 🔄 Tasa de refresco (Polling)
            refreshIntervalSecs: 30,
        };

        // ============================================================
        // 🗺️ INICIALIZACIÓN DEL MAPA
        // ============================================================

        const map = L.map('map', {
            zoomControl: false,
        }).setView(CONFIG.mapCenter, CONFIG.mapZoom);

        // Control de zoom abajo-derecha (menos intrusivo en móvil)
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Tiles — estilo limpio y claro (Voyager de CARTO) que resalta bien las calles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
            maxZoom: 19,
        }).addTo(map);

        // ============================================================
        // 🗺️ TRAZADO DE LA RUTA OFICIAL (GeoJSON)
        // ============================================================
        fetch('ruta.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#6b1d3a', // Granate oscuro de tu paleta (var(--burgundy)) para que resalte en mapa claro
                        weight: 4,
                        opacity: 0.7,
                        dashArray: '8, 8', // Línea punteada para indicar la ruta pendiente
                        lineCap: 'round'
                    }
                }).addTo(map);
            })
            .catch(error => console.error('Error cargando la ruta:', error));

        // ============================================================
        // 👑 ESTADO DE LOS REYES (Multi-Rey)
        // ============================================================

        const kingsState = {
            Melcior: {
                name: 'Rei Melcior',
                icon: '👑',
                color: '#d4a017', // Dorado
                marker: null,
                trailPoints: [],
                trailGroup: L.layerGroup().addTo(map),
                currentStreet: "Ubicació desconeguda",
                lastAddressFetch: 0
            },
            Gaspar: {
                name: 'Rei Gaspar',
                icon: '👑',
                color: '#ab2330', // Granate/Carmesí
                marker: null,
                trailPoints: [],
                trailGroup: L.layerGroup().addTo(map),
                currentStreet: "Ubicació desconeguda",
                lastAddressFetch: 0
            },
            Baltasar: {
                name: 'Rei Baltasar',
                icon: '👑',
                color: '#228b22', // Verde
                marker: null,
                trailPoints: [],
                trailGroup: L.layerGroup().addTo(map),
                currentStreet: "Ubicació desconeguda",
                lastAddressFetch: 0
            },
            Estrella: {
                name: 'Estrella d\'Orient',
                icon: '⭐',
                color: '#f0f8ff', // Blanco Plata
                marker: null,
                trailPoints: [],
                trailGroup: L.layerGroup().addTo(map),
                currentStreet: "Ubicació desconeguda",
                lastAddressFetch: 0
            }
        };

        function getKingIcon(king) {
            return L.divIcon({
                className: 'king-marker',
                html: `
                    <div class="king-marker__pulse" style="background: ${king.color}33"></div>
                    <div class="king-marker__inner" style="background: linear-gradient(135deg, ${king.color}dd, ${king.color}); box-shadow: 0 2px 12px ${king.color}80; border-color: ${king.color};">${king.icon}</div>
                `,
                iconSize: [60, 60],
                iconAnchor: [30, 30],
            });
        }

        let firstUpdate = true;

        async function fetchStreetName(lat, lng, kingId) {
            const now = Date.now();
            const king = kingsState[kingId];
            if (now - king.lastAddressFetch < 2000) return king.currentStreet;
            king.lastAddressFetch = now;

            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.address) {
                    const road = data.address.road || data.address.pedestrian || "";
                    const suburb = data.address.suburb || data.address.village || data.address.town || data.address.city || "";
                    if (road) {
                        king.currentStreet = road + (suburb ? `, ${suburb}` : '');
                    } else if (data.display_name) {
                        king.currentStreet = data.display_name.split(',')[0];
                    }
                }
            } catch (error) {
                console.error(`Error buscando calle para ${kingId}: `, error);
            }
            return king.currentStreet;
        }

        function formatPointTime(timestamp) {
            if (!timestamp) return new Date().toLocaleTimeString('ca-ES');
            const ptDate = new Date(timestamp);
            const today = new Date();
            const isToday = ptDate.getDate() === today.getDate() &&
                ptDate.getMonth() === today.getMonth() &&
                ptDate.getFullYear() === today.getFullYear();

            if (isToday) {
                return ptDate.toLocaleTimeString('ca-ES');
            } else {
                return ptDate.toLocaleDateString('ca-ES') + ' ' + ptDate.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' });
            }
        }

        async function updateMarker(kingId, lat, lng, timestamp) {
            if (!lat || !lng) return;
            const king = kingsState[kingId];
            const latlng = L.latLng(lat, lng);

            const generatePopupHTML = (streetName) => `
                <strong>${king.icon} ${king.name}</strong><br>
                📍 ${streetName}<br>
                <small style="opacity:0.7">${lat.toFixed(5)}, ${lng.toFixed(5)}</small><br>
                🕐 Última actualització: ${formatPointTime(timestamp)}
            `;

            if (!king.marker) {
                king.marker = L.marker(latlng, { icon: getKingIcon(king) })
                    .addTo(map)
                    .bindPopup(generatePopupHTML('Buscant carrer...'));
            } else {
                king.marker.setLatLng(latlng);
                king.marker.setPopupContent(generatePopupHTML(king.currentStreet));
            }

            // Centrar el mapa en el primer ping de la Estrella o de Melchor (Prioridad visual inicial)
            if (firstUpdate && (kingId === 'Estrella' || kingId === 'Melchor')) {
                map.setView(latlng, CONFIG.mapZoom);
                firstUpdate = false;
            }

            const newStreet = await fetchStreetName(lat, lng, kingId);
            if (king.marker) {
                king.marker.setPopupContent(generatePopupHTML(newStreet));
            }
        }

        // ============================================================
        // 🛤️ TRAIL — Rastro del recorrido
        // ============================================================

        function addTrailPoint(kingId, lat, lng, timestamp) {
            const king = kingsState[kingId];
            king.trailPoints.push({ lat, lng, timestamp });
            pruneOldPoints(kingId);
            drawTrail(kingId);
        }

        function pruneOldPoints(kingId) {
            const king = kingsState[kingId];
            const cutoff = Date.now() - (CONFIG.trailMaxHours * 60 * 60 * 1000);
            while (king.trailPoints.length > 0 && king.trailPoints[0].timestamp < cutoff) {
                king.trailPoints.shift();
            }
        }

        function drawTrail(kingId) {
            const king = kingsState[kingId];
            king.trailGroup.clearLayers();

            if (king.trailPoints.length < 2) return;

            const segments = CONFIG.trailSegments;
            const pointsPerSeg = Math.max(2, Math.ceil(king.trailPoints.length / segments));

            for (let i = 0; i < segments; i++) {
                const start = i * pointsPerSeg;
                const end = Math.min((i + 1) * pointsPerSeg + 1, king.trailPoints.length);
                if (start >= king.trailPoints.length) break;

                const segPoints = king.trailPoints.slice(start, end).map(p => [p.lat, p.lng]);
                if (segPoints.length < 2) continue;

                const t = segments === 1 ? 1 : i / (segments - 1);
                const opacity = CONFIG.trailOpacityMin + t * (CONFIG.trailOpacityMax - CONFIG.trailOpacityMin);

                const line = L.polyline(segPoints, {
                    color: king.color,
                    weight: CONFIG.trailWeight,
                    opacity: opacity,
                    lineCap: 'round',
                    lineJoin: 'round',
                });
                king.trailGroup.addLayer(line);
            }
        }

        // ============================================================
        // 🔌 ESTADO DE CONEXIÓN
        // ============================================================

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const loadingOverlay = document.getElementById('loading');

        function setStatus(state, timestamp) {
            statusDot.className = 'status-dot';
            switch (state) {
                case 'connected':
                    if (timestamp && (Date.now() - timestamp > 4 * 60 * 1000)) {
                        statusDot.classList.add('searching');
                        statusText.textContent = 'Reconnectant…';
                        statusDot.dataset.mode = 'reconnecting';
                    } else {
                        statusDot.classList.add('connected');
                        statusText.textContent = 'En directe';
                        statusDot.dataset.mode = 'live';
                    }
                    break;
                case 'searching':
                    statusDot.classList.add('searching');
                    statusText.textContent = 'Buscant senyal…';
                    statusDot.dataset.mode = 'searching';
                    break;
                default:
                    statusText.textContent = 'Sense connexió';
                    statusDot.dataset.mode = 'offline';
            }
        }

        // ============================================================
        // 🔥 POLLING — Conexión a Caché Local Estática (Server-Side)
        // ============================================================

        const CACHE_URL = `data.json`;
        let initialLoadDone = false;

        async function fetchLatestData() {
            try {
                if (!initialLoadDone) setStatus('searching');
                const url = `${CACHE_URL}?t=${Date.now()}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error(`Archivo no encontrado. HTTP ${response.status}`);
                const newData = await response.json();

                if (newData) {
                    const cutoff = Date.now() - (CONFIG.trailMaxHours * 60 * 60 * 1000);
                    let mostRecentGlobalTimestamp = 0;

                    for (const kingId in newData) {
                        if (!kingsState[kingId]) continue;
                        const kingData = newData[kingId];
                        if (!kingData) continue;

                        const entries = Object.values(kingData)
                            .filter(d => d && d.location && d.location.coords && d.location.timestamp)
                            .map(d => ({
                                lat: parseFloat(d.location.coords[CONFIG.latField]),
                                lng: parseFloat(d.location.coords[CONFIG.lngField]),
                                timestamp: new Date(d.location.timestamp).getTime(),
                            }))
                            .filter(p => !isNaN(p.lat) && !isNaN(p.lng) && p.timestamp >= cutoff)
                            .sort((a, b) => a.timestamp - b.timestamp);

                        if (entries.length > 0) {
                            const last = entries[entries.length - 1];
                            if (last.timestamp > mostRecentGlobalTimestamp) {
                                mostRecentGlobalTimestamp = last.timestamp;
                            }

                            if (!initialLoadDone) {
                                entries.forEach(p => kingsState[kingId].trailPoints.push(p));
                                drawTrail(kingId);
                                updateMarker(kingId, last.lat, last.lng, last.timestamp);
                            } else {
                                const king = kingsState[kingId];
                                const lastKnown = king.trailPoints.length > 0 ? king.trailPoints[king.trailPoints.length - 1] : null;
                                if (!lastKnown || last.timestamp > lastKnown.timestamp) {
                                    addTrailPoint(kingId, last.lat, last.lng, last.timestamp);
                                    updateMarker(kingId, last.lat, last.lng, last.timestamp);
                                }
                            }
                        }
                    }

                    if (mostRecentGlobalTimestamp > 0) {
                        setStatus('connected', mostRecentGlobalTimestamp);
                    }

                    if (!initialLoadDone) {
                        console.log(`🛤️ Histórico Caché Local múltiple cargado.`);
                        initialLoadDone = true;
                    }
                }
            } catch (err) {
                console.warn("Retraso sincronizando caché estático:", err.message);
            }
            loadingOverlay.classList.add('hidden');
        }

        // ============================================================
        // 🔄 Polling Silencioso
        // ============================================================
        // Consultar el caché estático del servidor en segundo plano
        // (Al ser un fichero estático, no consume apenas recursos del servidor)
        setInterval(() => {
            fetchLatestData();
        }, (CONFIG.refreshIntervalSecs || 20) * 1000);

        // Arrancamos la primera petición
        fetchLatestData();

        // Si tarda mucho, quitar loading igualmente por si falla la primera petición
        setTimeout(() => {
            loadingOverlay.classList.add('hidden');
        }, 5000);

        // ============================================================
        // ✨ EFECTO: Estrellas decorativas (fondo del mapa)
        // ============================================================

        // Pequeño detalle: añadimos unas estrellas en el header al hacer scroll
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🌟 ReisOrient — ¡Sistema Autónomo listo!');
            console.log('📋 Configuración:', CONFIG);
        });
    </script>

</body>

</html>
